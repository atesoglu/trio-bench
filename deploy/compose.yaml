services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: trio-bench-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: triobench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d triobench"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: trio-bench-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    container_name: trio-bench-otel
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel-collector-config.yaml:Z

  api-dotnet:
    build:
      context: ../src/dotnet
      dockerfile: Api/Dockerfile
    container_name: trio-bench-dotnet
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Postgres=Host=postgres;Database=triobench;Username=user;Password=password
      - ConnectionStrings__Redis=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
